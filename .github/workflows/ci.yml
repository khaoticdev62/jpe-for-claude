# Cross-platform quality gate. MANUAL ONLY: it never runs on push or pull request, so it spends no
# GitHub Actions minutes unless someone starts it from the Actions tab ("Run workflow").
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - run: npm audit --audit-level=high
