# Cross-platform quality gate. MANUAL ONLY: it never runs on push or pull request, so it spends no
# GitHub Actions minutes unless someone starts it from the Actions tab ("Run workflow") or with `gh workflow run ci.yml`.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      # The installed plugin runs the committed dist/ and hooks/center.js, so they must be exactly what src/ builds to.
      # `npm run package` just rebuilt it; any difference means someone forgot to commit a rebuild.
      - name: Committed dist/ matches the source
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code --stat -- dist hooks/center.js
      - run: npm audit --omit=dev --audit-level=high
